services:
  - type: web
    name: fraud-detection-mlops
    env: python
    pythonVersion: 3.12.0
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.0'
      - key: PIP_NO_BUILD_ISOLATION
        value: '1'
